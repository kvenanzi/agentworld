name: publish-mcp

# Publishes/updates this world's entry in the official MCP registry
# (registry.modelcontextprotocol.io) whenever server.json changes on main.
# Authenticates via GitHub OIDC — no secrets needed; the io.github.kvenanzi/*
# namespace is proven by this repository's identity.

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: publish-mcp

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
      - name: Login via GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP registry
        run: ./mcp-publisher publish
